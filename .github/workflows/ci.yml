name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_artifact:
    name: Build Artifact (Linux-x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc
        with:
          shared-key: rust-${{ runner.os }}-x86_64-unknown-linux-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (max runtime performance)
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_STRIP: "none"
          RUSTFLAGS: "-C target-cpu=x86-64-v3 -C link-arg=-Wl,-O3"
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package artifact (Linux-x86_64)
        id: package
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="music163bot-rust"
          SRC="target/x86_64-unknown-linux-gnu/release/${BINARY_NAME}"
          DEST="dist/${BINARY_NAME}"
          cp "$SRC" "$DEST"

          [ -f config.ini.example ] && cp config.ini.example dist/
          [ -f LICENSE ] && cp LICENSE dist/
          [ -f README.md ] && cp README.md dist/

          ARCHIVE_NAME="${BINARY_NAME}-ci-linux-x86_64-${GITHUB_SHA::7}"
          tar czf "${ARCHIVE_NAME}.tar.gz" -C dist .
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Linux-x86_64)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ci-linux-x86_64
          path: ${{ steps.package.outputs.archive }}
          archive: false
