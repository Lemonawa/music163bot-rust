name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_artifact:
    name: Build Artifact (Linux-x86_64)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-${{ runner.os }}
          cache-targets: false

      - name: Reset sccache stats
        shell: bash
        run: sccache --zero-stats || true

      - name: cargo build --release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package artifact (Linux-x86_64)
        id: package
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="music163bot-rust"
          SRC="target/x86_64-unknown-linux-gnu/release/${BINARY_NAME}"
          DEST="dist/${BINARY_NAME}"
          cp "$SRC" "$DEST"

          [ -f config.ini.example ] && cp config.ini.example dist/
          [ -f LICENSE ] && cp LICENSE dist/
          [ -f README.md ] && cp README.md dist/

          ARCHIVE_NAME="${BINARY_NAME}-ci-linux-x86_64-${GITHUB_SHA::7}"
          tar czf "${ARCHIVE_NAME}.tar.gz" -C dist .
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Linux-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-x86_64
          path: ${{ steps.package.outputs.archive }}

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          mkdir -p .ci
          sccache --show-stats 2>&1 | tee .ci/sccache-stats.txt || true

      - name: Summarize sccache stats
        if: always()
        shell: bash
        run: |
          STATS_FILE=".ci/sccache-stats.txt"
          if [ ! -f "$STATS_FILE" ]; then
            echo "No sccache stats file found."
            exit 0
          fi

          stats="$(cat "$STATS_FILE")"

          extract_field() {
            local pattern="$1"
            local result
            result="$(printf '%s\n' "$stats" | awk -v pat="$pattern" '$0 ~ pat {print $NF; exit}')"
            if [ -z "$result" ]; then
              echo "N/A"
            else
              echo "$result"
            fi
          }

          cache_hits="$(extract_field '^Cache hits[[:space:]]')"
          cache_misses="$(extract_field '^Cache misses[[:space:]]')"
          compile_requests="$(extract_field '^Compile requests[[:space:]]')"
          compile_executed="$(extract_field '^Compile requests executed[[:space:]]')"
          compile_errors="$(extract_field '^Compile errors[[:space:]]')"
          cache_hit_rate="$(printf '%s\n' "$stats" | awk '/^Cache hits rate[[:space:]]/ {print $(NF-1) " " $NF; exit}')"
          if [ -z "$cache_hit_rate" ]; then
            cache_hit_rate="$(printf '%s\n' "$stats" | awk '/^Cache hit rate[[:space:]]/ {print $(NF-1) " " $NF; exit}')"
          fi
          if [ -z "$cache_hit_rate" ]; then
            cache_hit_rate="N/A"
          fi

          {
            echo "### sccache summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Compile requests | ${compile_requests} |"
            echo "| Compile requests executed | ${compile_executed} |"
            echo "| Cache hits | ${cache_hits} |"
            echo "| Cache misses | ${cache_misses} |"
            echo "| Cache hit rate | ${cache_hit_rate} |"
            echo "| Compile errors | ${compile_errors} |"
            echo ""
            echo "<details><summary>Full <code>sccache --show-stats</code></summary>"
            echo ""
            echo '```text'
            cat "$STATS_FILE"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$cache_hits" = "0" ] && [ "$cache_misses" = "0" ]; then
            echo "::notice title=sccache::No cache activity detected (hits=0, misses=0)."
          fi
