name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Linux-x86_64)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-${{ runner.os }}
          cache-targets: false

      - name: Reset sccache stats
        shell: bash
        run: sccache --zero-stats || true

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy -D warnings
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package artifact (Linux-x86_64)
        id: package
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="music163bot-rust"
          SRC="target/x86_64-unknown-linux-gnu/release/${BINARY_NAME}"
          DEST="dist/${BINARY_NAME}"
          cp "$SRC" "$DEST"

          [ -f config.ini.example ] && cp config.ini.example dist/
          [ -f LICENSE ] && cp LICENSE dist/
          [ -f README.md ] && cp README.md dist/

          ARCHIVE_NAME="${BINARY_NAME}-ci-linux-x86_64-${GITHUB_SHA::7}"
          tar czf "${ARCHIVE_NAME}.tar.gz" -C dist .
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Linux-x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-x86_64
          path: ${{ steps.package.outputs.archive }}

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
