name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Verify & Build Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-${{ runner.os }}-x86_64-unknown-linux-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - parallel:
          - name: Check Formatting
            run: cargo fmt -- --check
          - name: Clippy Lints
            run: cargo clippy -- -D warnings
          - name: Run Tests
            run: cargo test

      - name: Build (max runtime performance)
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_STRIP: "none"
          RUSTFLAGS: "-C target-cpu=x86-64-v3 -C link-arg=-Wl,-O3"
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package artifacts (Linux-x86_64)
        id: package
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="music163bot-rust"
          SRC="target/x86_64-unknown-linux-gnu/release/${BINARY_NAME}"
          DEST="dist/${BINARY_NAME}"
          cp "$SRC" "$DEST"

          [ -f config.ini.example ] && cp config.ini.example dist/
          [ -f LICENSE ] && cp LICENSE dist/
          [ -f README.md ] && cp README.md dist/

          ARCHIVE_NAME="${BINARY_NAME}-ci-linux-x86_64-${GITHUB_SHA::7}"
          tar czf "${ARCHIVE_NAME}.tar.gz" -C dist .
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"

          # refresh_hires maintenance tool — standalone archive (binary only),
          # so operators without a Rust toolchain can refresh capped-quality
          # caches on the host where the bot's database lives.
          TOOL_SRC="target/x86_64-unknown-linux-gnu/release/refresh_hires"
          if [ -f "$TOOL_SRC" ]; then
            TOOL_ARCHIVE="refresh_hires-ci-linux-x86_64-${GITHUB_SHA::7}"
            tar czf "${TOOL_ARCHIVE}.tar.gz" -C target/x86_64-unknown-linux-gnu/release refresh_hires
            echo "tool_archive=${TOOL_ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact (Linux-x86_64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-linux-x86_64
          path: ${{ steps.package.outputs.archive }}
          archive: false

      - name: Upload refresh_hires tool (Linux-x86_64)
        if: ${{ steps.package.outputs.tool_archive != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh_hires-ci-linux-x86_64
          path: ${{ steps.package.outputs.tool_archive }}
          archive: false
