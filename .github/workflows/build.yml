name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runs_on }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              os_name: Linux-x86_64,
              runs_on: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              arch: x86_64,
              suffix: ""
            }
          - {
              os_name: Linux-aarch64,
              runs_on: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              arch: aarch64,
              suffix: ""
            }
          - {
              os_name: macOS-x86_64,
              runs_on: macos-latest,
              target: x86_64-apple-darwin,
              arch: x86_64,
              suffix: ""
            }
          - {
              os_name: macOS-aarch64,
              runs_on: macos-latest,
              target: aarch64-apple-darwin,
              arch: aarch64,
              suffix: ""
            }
          - {
              os_name: Windows-x86_64,
              runs_on: windows-latest,
              target: x86_64-pc-windows-msvc,
              arch: x86_64,
              suffix: ".exe"
            }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-registry-${{ runner.os }}
          # Let rust-cache focus on Cargo registry/git crates.
          # Build outputs are handled by sccache to avoid overlapping target caches.
          cache-targets: false

      - name: Reset sccache stats
        shell: bash
        run: sccache --zero-stats || true

      - name: Install cross compiler (Linux aarch64)
        if: runner.os == 'Linux' && matrix.platform.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.platform.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.platform.target }}

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          mkdir -p .ci
          sccache --show-stats 2>&1 | tee .ci/sccache-stats.txt || true

      - name: Summarize sccache stats
        if: always()
        shell: bash
        run: |
          STATS_FILE=".ci/sccache-stats.txt"
          if [ ! -f "$STATS_FILE" ]; then
            echo "No sccache stats file found."
            exit 0
          fi

          stats="$(cat "$STATS_FILE")"

          extract_field() {
            local pattern="$1"
            local result
            result="$(printf '%s\n' "$stats" | awk -v pat="$pattern" '$0 ~ pat {print $NF; exit}')"
            if [ -z "$result" ]; then
              echo "N/A"
            else
              echo "$result"
            fi
          }

          cache_hits="$(extract_field '^Cache hits[[:space:]]')"
          cache_misses="$(extract_field '^Cache misses[[:space:]]')"
          compile_requests="$(extract_field '^Compile requests[[:space:]]')"
          compile_executed="$(extract_field '^Compile requests executed[[:space:]]')"
          compile_errors="$(extract_field '^Compile errors[[:space:]]')"
          cache_hit_rate="$(printf '%s\n' "$stats" | awk '/^Cache hits rate[[:space:]]/ {print $(NF-1) " " $NF; exit}')"
          if [ -z "$cache_hit_rate" ]; then
            cache_hit_rate="$(printf '%s\n' "$stats" | awk '/^Cache hit rate[[:space:]]/ {print $(NF-1) " " $NF; exit}')"
          fi
          if [ -z "$cache_hit_rate" ]; then
            cache_hit_rate="N/A"
          fi

          {
            echo "### sccache summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Compile requests | ${compile_requests} |"
            echo "| Compile requests executed | ${compile_executed} |"
            echo "| Cache hits | ${cache_hits} |"
            echo "| Cache misses | ${cache_misses} |"
            echo "| Cache hit rate | ${cache_hit_rate} |"
            echo "| Compile errors | ${compile_errors} |"
            echo ""
            echo "<details><summary>Full <code>sccache --show-stats</code></summary>"
            echo ""
            echo '```text'
            cat "$STATS_FILE"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$cache_hits" = "0" ] && [ "$cache_misses" = "0" ]; then
            echo "::notice title=sccache::No cache activity detected (hits=0, misses=0)."
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="music163bot-rust"
          SRC="target/${{ matrix.platform.target }}/release/${BINARY_NAME}${{ matrix.platform.suffix }}"
          DEST="dist/${BINARY_NAME}${{ matrix.platform.suffix }}"
          cp "$SRC" "$DEST"
          
          # Copy auxiliary files
          [ -f config.ini.example ] && cp config.ini.example dist/
          [ -f LICENSE ] && cp LICENSE dist/
          [ -f README.md ] && cp README.md dist/
          
          # Create tar.gz archive
          cd dist
          ARCHIVE_NAME="${BINARY_NAME}-${{ matrix.platform.os_name }}"
          tar czf "../${ARCHIVE_NAME}.tar.gz" .
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          cd ..
        id: package-unix

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $BINARY_NAME = "music163bot-rust"
          $SRC = "target/${{ matrix.platform.target }}/release/${BINARY_NAME}.exe"
          $DEST = "dist/${BINARY_NAME}.exe"
          Copy-Item $SRC $DEST
          
          # Copy auxiliary files
          if (Test-Path "config.ini.example") { Copy-Item "config.ini.example" "dist/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/" }
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/" }
          
          # Create zip archive using PowerShell
          $ARCHIVE_NAME = "${BINARY_NAME}-${{ matrix.platform.os_name }}"
          Compress-Archive -Path "dist/*" -DestinationPath "${ARCHIVE_NAME}.zip" -Force
          "archive=${ARCHIVE_NAME}.zip" >> $env:GITHUB_OUTPUT
        id: package-windows

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os_name }}
          path: ${{ steps.package-unix.outputs.archive }}

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os_name }}
          path: ${{ steps.package-windows.outputs.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
