name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              os_name: Linux-x86_64,
              runs_on: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              arch: x86_64,
              suffix: "",
              rustflags: "-C target-cpu=x86-64-v3 -C link-arg=-Wl,-O3"
            }
          - {
              os_name: Linux-aarch64,
              runs_on: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              arch: aarch64,
              suffix: "",
              rustflags: "-C target-cpu=neoverse-n1 -C link-arg=-Wl,-O3"
            }
          - {
              os_name: macOS-x86_64,
              runs_on: macos-latest,
              target: x86_64-apple-darwin,
              arch: x86_64,
              suffix: "",
              rustflags: "-C target-cpu=x86-64-v3"
            }
          - {
              os_name: macOS-aarch64,
              runs_on: macos-latest,
              target: aarch64-apple-darwin,
              arch: aarch64,
              suffix: "",
              rustflags: "-C target-cpu=apple-m1"
            }
          - {
              os_name: Windows-x86_64,
              runs_on: windows-latest,
              target: x86_64-pc-windows-msvc,
              arch: x86_64,
              suffix: ".exe",
              rustflags: "-C target-cpu=x86-64-v3"
            }

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-${{ runner.os }}-${{ matrix.platform.target }}
          save-if: ${{ false }}

      - name: Install cross compiler (Linux aarch64)
        if: runner.os == 'Linux' && matrix.platform.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_STRIP: "none"
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        run: |
          if [ "${{ matrix.platform.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.platform.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BINARY_NAME="music163bot-rust"
          SRC="target/${{ matrix.platform.target }}/release/${BINARY_NAME}${{ matrix.platform.suffix }}"
          DEST="dist/${BINARY_NAME}${{ matrix.platform.suffix }}"
          cp "$SRC" "$DEST"

          # Copy auxiliary files
          [ -f config.ini.example ] && cp config.ini.example dist/
          [ -f LICENSE ] && cp LICENSE dist/
          [ -f README.md ] && cp README.md dist/

          # Create tar.gz archive
          cd dist
          ARCHIVE_NAME="${BINARY_NAME}-${{ matrix.platform.os_name }}"
          tar czf "../${ARCHIVE_NAME}.tar.gz" .
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          cd ..

          # refresh_hires maintenance tool — packaged separately (binary only)
          # so operators can refresh capped-quality caches on the host that owns
          # the bot's database, without pulling the full bot bundle.
          TOOL_SRC="target/${{ matrix.platform.target }}/release/refresh_hires${{ matrix.platform.suffix }}"
          if [ -f "$TOOL_SRC" ]; then
            TOOL_ARCHIVE="refresh_hires-${{ matrix.platform.os_name }}"
            tar czf "../${TOOL_ARCHIVE}.tar.gz" -C target/${{ matrix.platform.target }}/release "refresh_hires${{ matrix.platform.suffix }}"
            echo "tool_archive=${TOOL_ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
        id: package-unix

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $BINARY_NAME = "music163bot-rust"
          $SRC = "target/${{ matrix.platform.target }}/release/${BINARY_NAME}.exe"
          $DEST = "dist/${BINARY_NAME}.exe"
          Copy-Item $SRC $DEST

          # Copy auxiliary files
          if (Test-Path "config.ini.example") { Copy-Item "config.ini.example" "dist/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/" }
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/" }

          # Create zip archive using PowerShell
          $ARCHIVE_NAME = "${BINARY_NAME}-${{ matrix.platform.os_name }}"
          Compress-Archive -Path "dist/*" -DestinationPath "${ARCHIVE_NAME}.zip" -Force
          "archive=${ARCHIVE_NAME}.zip" >> $env:GITHUB_OUTPUT

          # refresh_hires maintenance tool — packaged separately (binary only).
          $TOOL_SRC = "target/${{ matrix.platform.target }}/release/refresh_hires.exe"
          if (Test-Path $TOOL_SRC) {
            $TOOL_ARCHIVE = "refresh_hires-${{ matrix.platform.os_name }}"
            Compress-Archive -Path $TOOL_SRC -DestinationPath "${TOOL_ARCHIVE}.zip" -Force
            "tool_archive=${TOOL_ARCHIVE}.zip" >> $env:GITHUB_OUTPUT
          }
        id: package-windows

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.os_name }}
          path: ${{ steps.package-unix.outputs.archive }}
          archive: false

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.os_name }}
          path: ${{ steps.package-windows.outputs.archive }}
          archive: false

      - name: Upload refresh_hires tool (Unix)
        if: runner.os != 'Windows' && steps.package-unix.outputs.tool_archive != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh_hires-${{ matrix.platform.os_name }}
          path: ${{ steps.package-unix.outputs.tool_archive }}
          archive: false

      - name: Upload refresh_hires tool (Windows)
        if: runner.os == 'Windows' && steps.package-windows.outputs.tool_archive != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh_hires-${{ matrix.platform.os_name }}
          path: ${{ steps.package-windows.outputs.tool_archive }}
          archive: false

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
