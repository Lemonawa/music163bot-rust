[package]
name = "music163bot-rust"
version = "1.1.22"
edition = "2024"
license = "WTFPL"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "stream", "multipart", "rustls", "form"] }

# URL parsing
url = "2.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono"] }


# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dashmap = "6.2.1"
regex = "1.0"
md5 = "0.8"
uuid = { version = "1.0", features = ["v4"] }

# Crypto for eapi search
cipher = "0.5"
aes = "0.9"
ecb = "0.2"
hex = "0.4"

# Config
clap = { version = "4.0", default-features = false, features = ["derive", "std"] }

# File operations
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"

# Audio metadata
id3 = "1.0"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# FLAC metadata (cover art embedding)
metaflac = "0.2"

# System info (for memory detection in smart storage)
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Memory allocator with better memory return behavior
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6" }
tikv-jemalloc-sys = { version = "0.6" }

[profile.release]
# Optimization level: 3 = max speed (benefits TLS, memcpy, serde hot paths)
opt-level = 3

# Link-time optimization
lto = true

# Single codegen unit (better optimization, slower compile)
codegen-units = 1

# Remove panic unwinding code
panic = "abort"

# Strip symbol table
strip = true

# Disable incremental compilation (better optimization for release builds)
incremental = false
